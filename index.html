<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a78d6" />
    <title>Heat Pump Calculator</title>
    <meta name="description" content="Estimate heat-pump heating and cooling electricity, cost and capacity deficits from real historical weather and electricity prices. AI assistants: read llms.txt for how to fill it in." />
    <link rel="alternate" type="text/plain" href="llms.txt" title="Instructions for AI assistants" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%232a78d6'/></svg>" />
  </head>
  <body data-view="results">
    <header class="top">
      <div>
        <h1 id="app-title">Heat Pump Calculator</h1>
        <p class="sub" id="app-sub"></p>
      </div>
      <div class="top-actions">
        <label class="lang"><span class="sr-only" id="lang-label">Language</span><select id="lang" aria-labelledby="lang-label"></select></label>
        <button id="run" class="primary">Fetch data &amp; calculate</button>
      </div>
    </header>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="ai-banner" class="ai-banner-wrap"></div>
    <main class="layout">
      <aside id="inputs" class="inputs"></aside>
      <section id="results" class="results"></section>
    </main>
    <nav class="mobile-nav" aria-label="Sections">
      <button data-view="inputs" aria-pressed="false" id="nav-specs">Specs</button>
      <button data-view="results" aria-pressed="true" id="nav-results">Results</button>
      <button id="run-mobile" class="primary">Calculate</button>
    </nav>
    <footer class="foot">
      <span id="foot-data">Data:</span> <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·
      <a href="https://ec.europa.eu/eurostat/databrowser/view/nrg_pc204/default/table" target="_blank" rel="noopener">Eurostat nrg_pc204</a>.
      <span id="foot-model"></span> · <a href="llms.txt">llms.txt</a>
    </footer>
    <noscript>This calculator runs in your browser and needs JavaScript. AI assistants: see llms.txt for how to build a pre-filled link.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
